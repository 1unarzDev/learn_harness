services:
  learn-harness:
    build:
      context: .
      # Use the server resolver/routes (Cloudflare WARP is active on creation).
      network: host
    image: learn-harness:local
    container_name: learn-harness
    restart: unless-stopped
    # Tunnel and load balancers run on this host. No public app port.
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: 3000
      LH_ANTHROPIC_BASE_URL: http://127.0.0.1:8081
      LH_OPENAI_BASE_URL: http://127.0.0.1:2455/v1
    env_file: .env.server
    volumes:
      - learn-harness-state:/state
    init: true
    stop_grace_period: 30s
    shm_size: 256mb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
volumes:
  learn-harness-state:
